# Option B: no domain name yet. HTTPS on the server's IP with a self-signed certificate.
# Traffic is encrypted, but browsers show a warning until you switch to a real certificate (Option A).
# Copy to /etc/httpd/conf.d/zabbix-portal.conf and create the certificate (see SECURITY.md).

<VirtualHost *:443>
    ServerName 94.103.163.184

    SSLEngine on
    SSLCertificateFile    /etc/pki/tls/certs/zabbix-portal.crt
    SSLCertificateKeyFile /etc/pki/tls/private/zabbix-portal.key
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # Zabbix web interface (served by Apache itself) under /zabbix
    ProxyPass        /zabbix !
    # Everything else goes to the portal
    ProxyPass        / http://127.0.0.1:8081/
    ProxyPassReverse / http://127.0.0.1:8081/

    ServerSignature Off
</VirtualHost>
