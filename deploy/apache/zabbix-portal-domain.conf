# Option A: you have a domain name pointing at this server.
# Copy to /etc/httpd/conf.d/zabbix-portal.conf, replace portal.example.com,
# then run:  sudo certbot --apache -d portal.example.com
# Certbot creates the HTTPS (443) copy of this site and redirects HTTP to HTTPS.

<VirtualHost *:80>
    ServerName portal.example.com

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    # Zabbix web interface (served by Apache itself) under /zabbix
    ProxyPass        /zabbix !
    # Everything else goes to the portal
    ProxyPass        / http://127.0.0.1:8081/
    ProxyPassReverse / http://127.0.0.1:8081/

    # Don't advertise versions
    ServerSignature Off
</VirtualHost>
